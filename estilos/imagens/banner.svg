<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Banner: lado dev e lado hotelaria</title>
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78B4F4"/>
      <stop offset="0.30" stop-color="#8C9FF2"/>
      <stop offset="0.50" stop-color="#B7A6F1"/>
      <stop offset="0.70" stop-color="#E0AEE2"/>
      <stop offset="1" stop-color="#F6B3CF"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="predio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6DDFB"/>
    </linearGradient>
    <linearGradient id="fadeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="fade"><rect x="0" y="0" width="620" height="400" fill="url(#fadeG)"/></mask>
    <pattern id="pontos" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.3" fill="#FFFFFF" opacity=".55"/>
    </pattern>
    <polygon id="estrela" points="0,-12 3.5,-3.7 11.4,-3.7 5.7,1.9 7.1,9.7 0,5.2 -7.1,9.7 -5.7,1.9 -11.4,-3.7 -3.5,-3.7"/>
  </defs>

  <rect width="1600" height="400" fill="url(#ceu)"/>
  <rect width="1600" height="400" fill="url(#brilho)"/>

  <g fill="#FFFFFF" opacity=".5">
    <ellipse cx="560" cy="80" rx="100" ry="24"/><ellipse cx="620" cy="64" rx="64" ry="26"/>
    <ellipse cx="900" cy="60" rx="110" ry="22"/><ellipse cx="960" cy="46" rx="68" ry="24"/>
    <ellipse cx="1060" cy="140" rx="80" ry="18"/>
  </g>

  <!-- lado dev -->
  <rect x="0" y="0" width="620" height="400" fill="url(#pontos)" mask="url(#fade)" opacity=".7"/>
  <g>
    <rect x="70" y="70" width="280" height="190" rx="16" fill="#1E2F5E" opacity=".9"/>
    <circle cx="96" cy="94" r="6" fill="#F8A5C2"/><circle cx="116" cy="94" r="6" fill="#FFE08A"/><circle cx="136" cy="94" r="6" fill="#9BE3C0"/>
    <text x="96" y="138" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#9BE3C0">$ npm run dev</text>
    <rect x="96" y="158" width="150" height="8" rx="4" fill="#6EC1F6"/>
    <rect x="96" y="182" width="110" height="8" rx="4" fill="#F8A5C2"/>
    <rect x="96" y="206" width="170" height="8" rx="4" fill="#FFE08A"/>
  </g>
  <g font-family="'Courier New', monospace" font-weight="700" fill="#FFFFFF">
    <text x="395" y="190" font-size="80" opacity=".42">&lt;/&gt;</text>
    <text x="470" y="320" font-size="70" opacity=".3">{ }</text>
  </g>

  <!-- ponte entre os lados -->
  <path d="M420 110 Q800 -40 1170 110" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 16" opacity=".75"/>

  <!-- lado hotel -->
  <g>
    <rect x="1090" y="180" width="100" height="220" rx="6" fill="#FFFFFF" opacity=".24"/>
    <rect x="1410" y="150" width="110" height="250" rx="6" fill="#FFFFFF" opacity=".24"/>
    <rect x="1530" y="220" width="70" height="180" rx="6" fill="#FFFFFF" opacity=".24"/>
    <rect x="1210" y="120" width="180" height="280" fill="url(#predio)"/>
    <rect x="1198" y="100" width="204" height="24" rx="8" fill="#B58FE8"/>
    <rect x="1228" y="48" width="144" height="44" rx="12" fill="#7B5CD6"/>
    <text x="1300" y="80" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">HOTEL</text>
    <use href="#estrela" transform="translate(1268,26)" fill="#FFD966"/>
    <use href="#estrela" transform="translate(1300,20)" fill="#FFD966"/>
    <use href="#estrela" transform="translate(1332,26)" fill="#FFD966"/>
    <rect x="1226" y="140" width="36" height="44" rx="5" fill="#D2C9F5"/>
    <rect x="1278" y="140" width="36" height="44" rx="5" fill="#FFE9A8"/>
    <rect x="1330" y="140" width="36" height="44" rx="5" fill="#D2C9F5"/>
    <rect x="1226" y="218" width="36" height="44" rx="5" fill="#FFE9A8"/>
    <rect x="1278" y="218" width="36" height="44" rx="5" fill="#D2C9F5"/>
    <rect x="1330" y="218" width="36" height="44" rx="5" fill="#FFE9A8"/>
    <rect x="1226" y="296" width="36" height="44" rx="5" fill="#D2C9F5"/>
    <rect x="1278" y="296" width="36" height="44" rx="5" fill="#FFE9A8"/>
    <rect x="1330" y="296" width="36" height="44" rx="5" fill="#D2C9F5"/>
    <rect x="1280" y="352" width="40" height="48" rx="6" fill="#7B5CD6"/>
  </g>
  <!-- sino flutuante -->
  <g opacity=".85">
    <path d="M1000 300 Q1000 262 1030 262 Q1060 262 1060 300 Z" fill="#FFFFFF"/>
    <circle cx="1030" cy="257" r="5" fill="#FFFFFF"/>
    <rect x="992" y="300" width="76" height="9" rx="4.5" fill="#FFFFFF"/>
  </g>

  <path d="M450 44 Q450 60 466 60 Q450 60 450 76 Q450 60 434 60 Q450 60 450 44 Z" fill="#FFFFFF" opacity="0.8"/><path d="M780 180 Q780 200 800 200 Q780 200 780 220 Q780 200 760 200 Q780 200 780 180 Z" fill="#FFFFFF" opacity="0.8"/><path d="M1120 54 Q1120 70 1136 70 Q1120 70 1120 86 Q1120 70 1104 70 Q1120 70 1120 54 Z" fill="#FFFFFF" opacity="0.8"/><path d="M700 316 Q700 330 714 330 Q700 330 700 344 Q700 330 686 330 Q700 330 700 316 Z" fill="#FFFFFF" opacity="0.6"/><path d="M60 316 Q60 330 74 330 Q60 330 60 344 Q60 330 46 330 Q60 330 60 316 Z" fill="#FFFFFF" opacity="0.6"/>

  <path d="M0 350 C300 322 600 382 900 352 S1400 332 1600 362 V400 H0 Z" fill="#FFFFFF" opacity=".22"/>
